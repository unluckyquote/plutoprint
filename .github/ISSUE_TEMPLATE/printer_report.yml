name: Printer report
description: Tell us whether your printer works with Pluto Print
title: "Printer: "
labels: ["printer"]
body:
  - type: input
    id: model
    attributes:
      label: Printer model
      placeholder: Samsung Xpress M2020W
    validations:
      required: true
  - type: textarea
    id: device-id
    attributes:
      label: Device ID
      description: Open http://printer.local/api/log just after connecting the printer and copy the line that starts "device id:".
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Does it print?
      options:
        - Yes, everything works
        - Prints, but something is wrong
        - It doesn't print
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What you tried (iPhone, iPad, Mac, Windows, Android, Linux), colour, two-sided printing, paper sizes, the toner level, and anything that looked wrong.
